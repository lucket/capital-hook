[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capital-hook"
version = "0.3.0"
description = "Async Python client and price streaming for the Capital.com REST/WebSocket API."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "pytest-cov>=5", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capital_hook = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "demo: runs against the real Capital.com DEMO account (opt-in; needs CAPITAL_DEMO_* env vars)",
]
addopts = "-m 'not demo'"

[tool.coverage.run]
source = ["capital_hook"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
